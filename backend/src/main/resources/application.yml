server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:coderzhang_blog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:blog}
    password: ${MYSQL_PASSWORD:blog123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  # 生产环境务必通过环境变量覆盖
  secret: ${JWT_SECRET:coderzhang-blog-secret-key-please-change-0123456789}
  expire-minutes: 10080

logging:
  level:
    com.coderzhang.blog: info
