# 本地开发环境（dev profile）：通过 SSH 隧道连服务器开发库
# 启动方式：双击仓库根目录 dev-backend.bat，或 IDEA 里 Active profiles 选 dev
# 密码由启动脚本/IDE 环境变量 DEV_DB_PASSWORD 注入，不写进仓库
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/coderzhang_blog_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: app
    password: ${DEV_DB_PASSWORD:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # dev 环境打印 SQL

logging:
  level:
    com.coderzhang.blog: debug
