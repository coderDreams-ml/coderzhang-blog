# coderzhang-blog 服务器部署编排
# 数据库使用宿主自装 MySQL（见「服务器部署」目录，已针对 1.6G 内存调优），
# backend 用 host 网络直连 127.0.0.1:3306，避免容器 MySQL 的内存开销。
services:
  backend:
    build: ./backend
    container_name: blog-backend
    restart: always
    network_mode: host
    environment:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DB: coderzhang_blog
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
