# 推送到 main 自动构建并部署到服务器
name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload front (scp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "front"
          target: /tmp/coderzhang-deploy

      - name: Deploy on server (ssh)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # 1. 前台静态文件（后台管理不在公网部署，本地运行）
            mkdir -p /var/www/coderzhang.top
            cp -a /tmp/coderzhang-deploy/front/. /var/www/coderzhang.top/
            chown -R www-data:www-data /var/www/coderzhang.top
            # 2. 后端：拉取代码并重建容器
            cd /opt/coderzhang-blog
            git pull
            docker compose up -d --build backend
            # 3. 生效
            systemctl reload nginx
            echo DEPLOY_OK
