<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文章 · coderzhang.top</title>
<style>
:root{--bg:#0b0f14;--card:#12161d;--border:#232a33;--text:#e6edf3;--muted:#8b949e;--accent:#4da3ff;--code:#79c0ff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.7}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.container{max-width:960px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,15,20,.9);backdrop-filter:blur(8px);z-index:10}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:Consolas,"JetBrains Mono",monospace;font-weight:700;font-size:18px}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:22px}
.nav-links a{color:var(--muted);font-size:14px}
.nav-links a:hover{color:var(--text);text-decoration:none}
footer{border-top:1px solid var(--border);margin-top:64px;padding:28px 0;text-align:center;color:var(--muted);font-size:13px}
.meta{color:var(--muted);font-size:13px}
.mono{font-family:Consolas,monospace}
article{max-width:760px;margin:0 auto;padding:64px 0}
article h1{font-size:32px;margin-bottom:10px;line-height:1.3}
#article-meta{margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid var(--border)}
#article-body h2{font-size:22px;margin:36px 0 14px}
#article-body h3{font-size:18px;margin:28px 0 12px}
#article-body p{margin-bottom:14px;color:#c9d1d9}
#article-body ul,#article-body ol{margin:0 0 14px 24px;color:#c9d1d9}
#article-body li{margin-bottom:6px}
#article-body code{background:#0d1117;border:1px solid var(--border);border-radius:5px;padding:1px 7px;font-family:Consolas,monospace;font-size:13px;color:var(--code)}
#article-body pre{background:#0d1117;border:1px solid var(--border);border-radius:10px;padding:16px;overflow-x:auto;margin:12px 0}
#article-body pre code{border:none;background:none;padding:0}
#article-body blockquote{border-left:3px solid var(--accent);padding:4px 16px;margin:14px 0;color:var(--muted)}
#article-body img{max-width:100%;border-radius:8px}
.back{margin-bottom:24px;display:inline-block}
@media(max-width:640px){
.container{padding:0 16px}
.nav{height:52px}
.nav-links{gap:14px}
.nav-links a{font-size:13px}
.logo{font-size:16px}
article{padding:40px 0}
article h1{font-size:26px}
footer{margin-top:40px}
}</style>
</head>
<body>
<header><div class="container"><nav class="nav">
<a class="logo" href="/">coder<span>zhang</span>.top</a>
<div class="nav-links">
<a href="/">首页</a>
<a href="/blog/" style="color:var(--text)">博客</a>
<a href="/#projects">项目</a>
<a href="/#about">关于</a>
</div>
</nav></div></header>
<main class="container">
<article>
<a class="back meta" href="/blog/">← 返回博客列表</a>
<h1 id="article-title">加载中...</h1>
<div id="article-meta" class="meta mono"></div>
<div id="article-body"><p class="meta">文章加载中...</p></div>
</article>
</main>
<footer><div class="container">
© 2025 coderzhang · 由 <span style="font-family:Consolas,monospace;color:#79c0ff">Spring Boot + Nginx</span> 驱动 · hello@coderzhang.top
</div></footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
<script src="/js/article.js" defer></script>
</body>
</html>
